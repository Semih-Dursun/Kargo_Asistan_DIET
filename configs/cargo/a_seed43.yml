recipe: default.v1
language: tr
pipeline:
- name: WhitespaceTokenizer
- name: CountVectorsFeaturizer
- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 1
  max_ngram: 4
- name: DIETClassifier
  epochs: 100
  random_seed: 43
  batch_size:
  - 64
  - 128
  constrain_similarities: true
- name: FallbackClassifier
  threshold: 0.3
